<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasay Web Design</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #bbb;
            font-size: 20px;
        }

        .projects {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .card {
            background: #1d1d1d;
            width: 280px;
            padding: 30px;
            border-radius: 15px;
        }

        .card h2 {
            margin-top: 0;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <header>
        <h1>Wasay Web Design</h1>
        <p class="subtitle">
            Modern websites for small businesses.
        </p>
    </header>

    <section class="projects">

        <div class="card">
            <h2>💈 Royal Cuts Riyadh</h2>
            <p>Modern barber shop website demo.</p>

            <a class="button"
               href= https://assassinssword7-create.github.io/wasay-first-website/
               target="_blank">
                View Website
            </a>
        </div>

        <div class="card">
            <h2>🍔 Restaurant</h2>
            <p>Restaurant website demo coming soon.</p>
        </div>

        <div class="card">
            <h2>⚽ Football Academy</h2>
            <p>Football academy website demo coming soon.</p>
        </div>

    </section>

</body>
</html>
